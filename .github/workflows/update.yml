name: Auto Update Supreme Toto

on:
  schedule:
    # Malaysia time = UTC+8
    # 23:30 MYT = 15:30 UTC

    # Wednesday
    - cron: "30 14 * * 3"

    # Saturday
    - cron: "30 14 * * 6"

    # Sunday
    - cron: "30 14 * * 0"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run crawler (with retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            python crawler.py && break
            echo "Failed, waiting 30s before retry..."
            sleep 30
          done

      - name: Commit and push
        run: |
          git config user.name "auto-lotto-bot"
          git config user.email "bot@example.com"
          git add results.json
          git diff --cached --quiet || git commit -m "Auto update: $(date '+%Y-%m-%d %H:%M') MYT"
          git push
